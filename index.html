<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คำนวณสิทธิ ไทยช่วยไทย พลัส (60/40)</title>
    <!-- เรียกใช้ Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- เรียกใช้ฟอนต์ Prompt จาก Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Prompt', sans-serif; }
    </style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100 w-full max-w-md">
        <h1 class="text-2xl font-semibold text-slate-800 mb-6 text-center">คำนวณสิทธิ 60/40</h1>

        <div class="mb-6">
            <label for="price" class="block text-sm font-medium text-slate-500 mb-2">ราคาสินค้าทั้งหมด (บาท)</label>
            <input 
                type="number" 
                id="price" 
                class="w-full px-4 py-3 rounded-xl border border-slate-200 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent text-lg transition-all" 
                placeholder="0.00" 
                oninput="calculate()"
            >
        </div>

        <div class="space-y-4">
            <!-- ส่วนที่รัฐจ่าย -->
            <div class="bg-blue-50/50 p-4 rounded-xl flex justify-between items-center border border-blue-100">
                <span class="text-blue-700 font-medium">รัฐช่วยจ่าย (60%)</span>
                <span id="govPay" class="text-xl font-semibold text-blue-600">0.00 ฿</span>
            </div>

            <!-- ส่วนที่เราจ่ายเอง -->
            <div class="bg-emerald-50/50 p-4 rounded-xl flex justify-between items-center border border-emerald-100">
                <span class="text-emerald-700 font-medium">เราจ่ายเอง</span>
                <span id="myPay" class="text-xl font-semibold text-emerald-600">0.00 ฿</span>
            </div>
        </div>

        <p class="text-xs text-slate-400 mt-6 text-center">*หมายเหตุ: รัฐช่วยจ่ายสูงสุด 200 บาท/วัน</p>
    </div>

    <script>
        function calculate() {
            // ดึงค่าจากช่อง Input
            const priceInput = document.getElementById('price').value;
            const price = parseFloat(priceInput) || 0;

            // 1. คำนวณส่วนที่รัฐช่วยจ่าย (60%)
            let govShare = price * 0.6;

            // 2. เช็คเงื่อนไข: รัฐจ่ายสูงสุดไม่เกิน 200 บาท
            if (govShare > 200) {
                govShare = 200;
            }

            // 3. คำนวณส่วนที่เราต้องจ่ายเอง (ราคาสินค้า - ส่วนที่รัฐจ่าย)
            let myShare = price - govShare;

            // 4. แสดงผลลัพธ์บนหน้าเว็บ พร้อมจัดฟอร์แมตตัวเลขให้มีคอมม่าและทศนิยม 2 ตำแหน่ง
            document.getElementById('govPay').innerText = govShare.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' ฿';
            document.getElementById('myPay').innerText = myShare.toLocaleString('th-TH', {minimumFractionDigits: 2, maximumFractionDigits: 2}) + ' ฿';
        }
    </script>
</body>
</html>
