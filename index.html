<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>คำนวณสิทธิ ไทยช่วยไทย พลัส (60/40)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style> body { font-family: 'Prompt', sans-serif; } </style>
</head>
<body class="bg-slate-50 flex items-center justify-center min-h-screen p-4">
    <div class="bg-white p-8 rounded-2xl shadow-sm border border-slate-100 w-full max-w-md">
        <h1 class="text-2xl font-semibold text-slate-800 mb-6 text-center">คำนวณสิทธิ 60/40</h1>

        <div class="space-y-5">
            <div>
                <label for="price" class="block text-sm font-medium text-slate-500 mb-1">1. ราคาสินค้าทั้งหมด (บาท)</label>
                <input 
                    type="number" 
                    id="price" 
                    oninput="calculate('price')"
                    class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:outline-none focus:ring-2 focus:ring-slate-400 text-lg transition-all" 
                    placeholder="ใส่ราคาสินค้า..."
                >
            </div>

            <div>
                <label for="govPay" class="block text-sm font-medium text-blue-600 mb-1">2. รัฐช่วยจ่าย (สูงสุด 200 ฿)</label>
                <input 
                    type="number" 
                    id="govPay" 
                    oninput="calculate('gov')"
                    class="w-full px-4 py-3 rounded-xl border border-blue-200 focus:outline-none focus:ring-2 focus:ring-blue-400 text-lg bg-blue-50/50 text-blue-700 font-medium transition-all" 
                    placeholder="รัฐจ่ายให้..."
                >
            </div>

            <div>
                <label for="myPay" class="block text-sm font-medium text-emerald-600 mb-1">3. เราจ่ายเอง (บาท)</label>
                <input 
                    type="number" 
                    id="myPay" 
                    oninput="calculate('my')"
                    class="w-full px-4 py-3 rounded-xl border border-emerald-200 focus:outline-none focus:ring-2 focus:ring-emerald-400 text-lg bg-emerald-50/50 text-emerald-700 font-medium transition-all" 
                    placeholder="ส่วนที่เราต้องจ่าย..."
                >
            </div>
        </div>

        <div class="mt-6 p-4 bg-amber-50 rounded-xl border border-amber-100">
            <p class="text-xs text-amber-700 leading-relaxed">
                <b>💡 ทริคการใช้งาน:</b> พิมพ์ตัวเลขลงในช่องไหนก็ได้ ระบบจะคำนวณอีก 2 ช่องที่เหลือให้อัตโนมัติ! <br>
                <span class="text-amber-600/80">(หมายเหตุ: หากใส่ช่องรัฐช่วยจ่ายเกิน 200 ระบบจะปรับลดลงมาที่ 200 ทันทีตามเงื่อนไขโครงการ)</span>
            </p>
        </div>
    </div>

    <script>
        // ดึง Element ของทั้ง 3 ช่องมาเก็บไว้
        const elPrice = document.getElementById('price');
        const elGov = document.getElementById('govPay');
        const elMy = document.getElementById('myPay');

        function calculate(source) {
            let price = 0, gov = 0, my = 0;

            // กรณีที่ 1: พิมพ์ที่ช่อง "ราคาสินค้าทั้งหมด"
            if (source === 'price') {
                price = parseFloat(elPrice.value) || 0;
                gov = price * 0.6; // รัฐช่วย 60%
                if (gov > 200) gov = 200; // สูงสุด 200
                my = price - gov;
            }
            
            // กรณีที่ 2: พิมพ์ที่ช่อง "รัฐช่วยจ่าย"
            else if (source === 'gov') {
                gov = parseFloat(elGov.value) || 0;
                
                // ถ้ารัฐจ่ายเกิน 200 บังคับให้เป็น 200 ทันที
                if (gov > 200) {
                    gov = 200;
                    elGov.value = 200;
                }
                
                // ถ้ารัฐจ่าย 60% ราคาสินค้าเต็มจะเท่ากับ รัฐจ่าย / 0.6
                price = gov / 0.6;
                my = price - gov;
            }
            
            // กรณีที่ 3: พิมพ์ที่ช่อง "เราจ่ายเอง"
            else if (source === 'my') {
                my = parseFloat(elMy.value) || 0;
                
                // จุดตัดคือ 133.33 บาท (ถ้าจ่ายเอง 133.33 บาทขึ้นไป แสดงว่ารัฐจ่ายเต็ม 200 ไปแล้ว)
                if (my <= 133.3333) {
                    // ถ้าเราจ่าย 40% ราคาเต็มจะเท่ากับ เราจ่าย / 0.4
                    price = my / 0.4;
                    gov = price - my;
                } else {
                    // ถ้ายอดจ่ายเองสูงกว่าจุดตัด แปลว่ารัฐช่วยตันที่ 200 ไปแล้ว
                    gov = 200;
                    price = my + gov;
                }
            }

            // แสดงผลลัพธ์ในช่องที่ "ไม่ได้ถูกพิมพ์อยู่" (เพื่อไม่ให้รบกวนเคอร์เซอร์เวลาพิมพ์)
            if (source !== 'price') elPrice.value = price > 0 ? price.toFixed(2) : '';
            if (source !== 'gov') elGov.value = gov > 0 ? gov.toFixed(2) : '';
            if (source !== 'my') elMy.value = my > 0 ? my.toFixed(2) : '';
        }
    </script>
</body>
</html>
